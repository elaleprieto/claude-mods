name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, format, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # LEFTHOOK=0 skips installing git hooks in CI.
      - run: LEFTHOOK=0 pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm test
